      <div class="textarea-wrapper">
        <label for="input-text" class="visually-hidden">Text to translate</label>
        <textarea
          id="input-text"
          class="input-textarea"
          placeholder="Start typing..."
          maxlength="50000"
          rows="1"
        ></textarea>
        <span id="char-counter" class="char-counter">0 / 50000</span>
      </div>

      <button type="button" id="translate-btn" class="translate-btn" disabled>
        <span class="btn-content">
          <span class="btn-text">Translate</span>
          <span class="btn-shortcut" style="opacity: 0.7; font-size: 13px; font-weight: 500; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px; margin-left: 4px;">⌘↵</span>

            <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="btn-loading" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span>Translating...</span>
        </span>
      </button>

        <span class="divider-line"></span>

        <span class="divider-line"></span>
      </div>
